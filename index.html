<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>网站嵌入示例</title>
    <style>
        /* 使用CSS样式让iframe更美观 */
        .embedded-frame {
            width: 100%;       /* 宽度占满父容器 */
            height: 600px;     /* 固定高度 */
            border: none;      /* 去除边框 */
        }
    </style>
</head>
<body>
    <!-- 核心代码在这里 -->
    <iframe 
        src="http://43.139.206.169/" 
        class="embedded-frame"
        title="嵌入的网站内容">
    </iframe>

</body>
</html>
